# AnywhereBot LLM settings. Edit this file to swap providers — no code changes.
#
# provider: ollama | groq | gemini | openrouter | openai_compat | auto
#
# auto resolution:
#   1. Ollama if http://127.0.0.1:11434 answers
#   2. else first set env key among GROQ_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY
#
# Optional env overrides (useful in Docker):
#   ANYWHEREBOT_PROVIDER, ANYWHEREBOT_MODEL, ANYWHEREBOT_BASE_URL, ANYWHEREBOT_API_KEY_ENV

provider: ollama
model: llama3.2
base_url: http://127.0.0.1:11434/v1
timeout_s: 120

# --- Groq (free/fast cloud; tool-capable) ---
# provider: groq
# model: openai/gpt-oss-20b
# api_key_env: GROQ_API_KEY
# Default base_url: https://api.groq.com/openai/v1
# llama-3.3-70b-versatile was shut down 2026-08-16. Current free-tier chat+tools
# model: openai/gpt-oss-20b (also openai/gpt-oss-120b, qwen/qwen3.6-27b).
# List live ids: python -m anywherebot models

# --- Gemini (Google OpenAI-compatible endpoint) ---
# provider: gemini
# model: gemini-3.6-flash
# api_key_env: GEMINI_API_KEY
# Default base_url: https://generativelanguage.googleapis.com/v1beta/openai/

# --- OpenRouter (prefer a :free slug, or the free router) ---
# provider: openrouter
# model: openrouter/free
# api_key_env: OPENROUTER_API_KEY
# Default base_url: https://openrouter.ai/api/v1

# --- Generic vLLM / llama.cpp / LM Studio ---
# provider: openai_compat
# model: your-model-id
# base_url: http://127.0.0.1:1234/v1
# api_key_env: OPENAI_API_KEY   # optional; "ollama" is sent if the env is empty
